{% load static %}
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}SisaBijak — Selamatkan Makanan, Lawan Perubahan Iklim{% endblock title %}</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body>
    <header class="navbar">
        <a href="{% url 'main:show_main' %}" class="brand">SisaBijak</a>

        <form class="search" role="search" onsubmit="return false">
            <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <circle cx="11" cy="11" r="7"/>
                <path d="m20 20-3.5-3.5"/>
            </svg>

            <input type="search" placeholder="Cari makanan..." aria-label="Cari makanan">

            <button type="button" class="location">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                    <path d="M12 21s-7-6.2-7-11a7 7 0 1 1 14 0c0 4.8-7 11-7 11z"/>
                    <circle cx="12" cy="10" r="2.5"/>
                </svg>
                Depok
            </button>
        </form>

        <nav class="nav-links" aria-label="Menu utama">
            <a href="#">MarketPlace</a>
            <a href="#impact">Impact</a>
            <a href="#">Contact</a>
        </nav>

        <div class="nav-actions">
            {% if user.is_authenticated %}
                <a href="{% url 'main:profile' %}" class="btn btn-dark">Profile</a>
            {% else %}
                <a href="{% url 'main:login' %}" class="btn btn-dark">Login</a>
            {% endif %}
        </div>
    </header>

    {% block content %}{% endblock content %}
</body>
</html>
