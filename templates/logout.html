{% load static %}
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logout — SisaBijak</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body class="auth-body">
    <main class="login-page">
        <a class="back-home" href="{% url 'main:show_main' %}">
            ← Cancel Logout
        </a>

        <section class="login-card logout-card">
            <p class="login-eyebrow">See you soon</p>
            <h1>Logout?</h1>

            <p class="login-description">
                Apakah Anda yakin ingin keluar dari akun SisaBijak?
            </p>

            <form method="POST" class="logout-form">
                {% csrf_token %}

                <button type="submit" class="btn btn-dark logout-button">
                    Ya, Logout
                </button>

                <a href="{% url 'main:show_main' %}" class="btn btn-outline logout-button">
                    Batal
                </a>
            </form>
        </section>
    </main>
</body>
</html>
